# Provenance registry. Status values:
#   confirmed_primary   - read on the publisher's own page (URL opened)
#   secondary_only      - figure seen only on a news/aggregator/search page, not the official file
#   not_found           - could not be located or opened
# Audit run 2026-10-18 by a research subagent; official CEA, CPHEEO, KERC, BWSSB, CGWB pages
# would not open (login wall, 403, certificate error, connection refused). A human should open them.
# engine_value is what the code currently uses (see engine/data_sources.py, VALUE_STATUS).

- id: wri_india_data_centres_2026
  url: https://wri-india.org/data/more-half-indias-data-centres-are-water-stressed-regions
  status: confirmed_primary
  evidence: '"75% of all data centres located across just five states: Maharashtra, Tamil Nadu, Karnataka, Telangana and Uttar Pradesh"; "278 facilities nationally"; published May 18, 2026'
  licence: "No licence statement; footer says (c) 2026 World Resources Institute. Terms of Use not read."
  used_for: problem context only, not an engine input

- id: cea_co2_baseline
  url: https://cea.nic.in/cdm-co2-baseline-database/
  status: secondary_only
  evidence: 'Saur Energy article quotes V20.0 (Dec 2024, FY2023-24): "weighted average emission factor adjusted for renewable energy ... 0.727 tCO2/MWh". Search snippets give V21.0 (FY2024-25) about 0.710; unverified.'
  engine_value: "710 kg/MWh for Bengaluru/southern grid (718 Chennai, 705 Mumbai)"
  verdict: "NOT supported. 0.710 appears only as an unverified national FY2024-25 figure; no southern-region figure found. Per-city values in the engine are unsourced."
  licence: not_found


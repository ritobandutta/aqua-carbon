- id: karimi_2022
  url: https://doi.org/10.1016/j.resconrec.2022.106194
  status: secondary_only
  evidence: 'Record opened via experts.arizona.edu. Two Phoenix colocation data centres: DC1 air-cooled chillers, DC2 water-cooled chillers plus evaporative. "DC1 average PUE is nearly 13% higher compared to DC2"; "its source WUE is 66% lower than DC2". No absolute PUE/WUE found.'
  licence: "(c) 2022 Elsevier B.V.; not labelled open access"
  verdict: "Supports the direction of the trade-off only. Engine PUE/WUE base values (1.20/2.10, 1.45/0.02, 1.27/0.65) are NOT taken from this paper and carry no citation."

- id: lbnl_2024_us_dc_energy
  url: https://eta-publications.lbl.gov/sites/default/files/2024-12/lbnl-2024-united-states-data-center-energy-usage-report_1.pdf
  status: confirmed_primary
  evidence: 'p.48: "average WUE ... just over 0.36 L/kWh through 2023", "between 0.45 and 0.48 L/kWh" after; p.46-47: hyperscale "0.1-0.3 L/kWh"; Section 5: "4.52 L/kWh" indirect water.'
  licence: "US Government non-exclusive licence only; no open licence"
  verdict: "US fleet averages are far below the engine's evaporative WUE of 2.10 L/kWh (annual). That base value looks high and needs a source or a lower, cited figure."

- id: kerc_ht_tariff
  url: https://www.theprint.in/india/kerc-increases-electricity-tariffs-for-commercial-industrial-consumers/2869823/
  status: secondary_only
  evidence: 'PTI: "HT-2a (industrial) consumers will pay a demand charge of Rs 365 per kVA and an energy charge of Rs 6.70 per unit". Energy charge only, all Karnataka supply companies.'
  engine_value: "INR 8.50/kWh all-in"
  verdict: "Not verified. Base energy charge is 6.70; 8.50 all-in would need demand charge, duty and surcharges. KERC order not opened."

